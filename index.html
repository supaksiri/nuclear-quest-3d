<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuclear Quest 3D</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><header><h1>Nuclear Quest 3D</h1><p>ภารกิจพิชิตโลกกัมมันตรังสี</p></header><main><section id="scene"></section><section class="panel"><h2 id="lesson-title">การแผ่รังสี</h2><p id="lesson-text">เลือกชนิดรังสีแล้วสังเกตอำนาจทะลุผ่าน</p><div class="controls"><button data-rad="alpha">α แอลฟา</button><button data-rad="beta">β บีตา</button><button data-rad="gamma">γ แกมมา</button></div><div class="controls"><button data-shield="paper">กระดาษ</button><button data-shield="aluminum">อะลูมิเนียม</button><button data-shield="lead">ตะกั่ว</button></div><hr><h2>เครื่องจำลองครึ่งชีวิต</h2><label>จำนวนเริ่มต้น <input id="n0" type="number" value="1000" min="1"></label><label>จำนวนครึ่งชีวิต <input id="halves" type="range" min="0" max="10" value="1"><span id="halves-value">1</span></label><div class="result"><strong id="remaining">500</strong><span>หน่วยคงเหลือ</span></div><canvas id="chart" width="700" height="260"></canvas></section></main></div><script type="module" src="script.js"></script></body></html>
